[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontend-agent"
version = "0.3.0"
requires-python = ">=3.11"
description = "Forma: conversational frontend development studio powered by LangGraph"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain>=1,<2",
    "langchain-ollama>=1,<2",
    "langchain-chroma>=1,<2",
    "langchain-text-splitters>=1,<2",
    "chromadb>=1,<2",
    "pydantic>=2.10,<3",
    "typer>=0.9",
    "rich>=13",
    "prompt_toolkit>=3.0,<4",
    "pytest>=8.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.28,<1",
    "langchain-openai>=1,<2",
]

[project.scripts]
frontend-agent = "cli.app:main"
frontend-studio = "studio.app:main"

[tool.setuptools.packages.find]
include = ["agents*", "browser*", "cache*", "cli*", "eval*", "rag*", "sandbox*", "studio*"]

[tool.setuptools]
py-modules = ["config", "graph", "llm", "main", "memory", "state", "tools", "validators", "frameworks"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
eval = ["benchmarks/**/*.json"]
studio = ["static/**/*"]
